name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build exe with PyInstaller
      run: pyinstaller red_pen.spec --noconfirm

    - name: Verify artifact
      shell: pwsh
      run: |
        if (-not (Test-Path "dist/RedPen.exe")) { Write-Error "RedPen.exe not built"; exit 1 }
        Get-Item dist/RedPen.exe | Select-Object Name, Length
        if ((Get-Item dist/RedPen.exe).Length -lt 10MB) { Write-Error "exe too small"; exit 1 }

    - name: Extract release notes from commit
      id: notes
      shell: bash
      run: |
        echo "body=$(git log -1 --pretty=%B $(git describe --tags --abbrev=0)^..$(git describe --tags --abbrev=0) 2>/dev/null || git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: 红笔 RedPen ${{ github.ref_name }}
        body: |
          ## 红笔 RedPen ${{ github.ref_name }}（Windows 单文件版）

          **开发者**：JunyuZhan ｜ **联系邮箱**：junyuzhan@outlook.com ｜ 问题反馈请到 [Issues](https://github.com/JunyuZhan/red-pen/issues) 或邮件联系

          **安装使用**：下载 `RedPen.exe`，放到任意文件夹双击即可运行（无需安装 Python）。
          - ⚠️ 首次运行 Windows 会提示"已保护你的电脑"，点 **更多信息 → 仍要运行** 即可；杀毒软件误报请添加信任
          - 启动后自动打开浏览器进入工作台，手机连同一 WiFi 扫设置页二维码即可拍照批改
          - 数据存储在 exe 同级的 `data` 文件夹，备份该文件夹即备份全部数据
          - 首次使用请在「设置」页填入模型 API Key（支持 DeepSeek / 通义 / 智谱 / 自定义 OpenAI 兼容接口）
          - 默认登录 PIN：123456（请立即在设置页修改）
          - 许可证：PolyForm Noncommercial——个人与教育使用免费，禁止商用

          *构建于 GitHub Actions，提交 ${{ github.sha }}*
        files: dist/RedPen.exe
        draft: false
        prerelease: false
