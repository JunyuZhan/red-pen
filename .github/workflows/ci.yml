name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import checks
      run: |
        python - <<'EOF'
        from backend.config import settings
        print("✅ backend.config:", settings.HOST, settings.PORT)

        from backend.database import Base, SessionLocal
        print("✅ backend.database 模型定义完整")

        from backend.app import app
        print(f"✅ FastAPI应用创建成功, {len(app.routes)} 个路由")
        EOF

    - name: API smoke test
      run: |
        python - <<'EOF'
        from fastapi.testclient import TestClient
        from backend.app import app
        from backend.database import init_db

        init_db()  # 显式初始化数据库（startup 事件在 TestClient 下不触发）
        client = TestClient(app)
        r = client.get("/health")
        assert r.status_code == 200 and r.json()["status"] == "ok", r.text
        print("✅ /health")

        r = client.get("/api/settings/llm")
        assert r.status_code == 200 and r.json()["success"], r.text
        print("✅ /api/settings/llm GET")

        r = client.post("/api/settings/llm", json={"provider": "qwen", "api_key": "sk-ci-test-0000000000"})
        assert r.status_code == 200 and r.json()["success"], r.text
        r = client.get("/api/settings/llm")
        assert r.json()["has_api_key"], r.text
        print("✅ /api/settings/llm POST + 回读")

        r = client.get("/")
        assert r.status_code == 200, r.text
        r = client.get("/settings")
        assert r.status_code == 200, r.text
        print("✅ 页面路由 / 与 /settings")

        print("🎉 API 冒烟测试全部通过")
        EOF

    - name: Template checks
      run: |
        for f in frontend/templates/index.html frontend/templates/mobile.html frontend/templates/settings.html; do
          test -f "$f" || { echo "❌ $f 不存在"; exit 1; }
          echo "✅ $f 存在"
        done

    - name: Project structure check
      run: |
        for f in main.py requirements.txt README.md backend/app.py backend/config.py backend/database.py backend/models/grading_engine.py backend/routes/grading.py backend/routes/settings.py; do
          test -f "$f" || { echo "❌ $f 不存在"; exit 1; }
          echo "✅ $f 存在"
        done
