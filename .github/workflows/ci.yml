name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import checks
      run: |
        python - <<'EOF'
        from backend.config import settings
        print("✅ backend.config:", settings.HOST, settings.PORT)

        from backend.database import Base, SessionLocal
        print("✅ backend.database 模型定义完整")

        from backend.app import app
        print(f"✅ FastAPI应用创建成功, {len(app.routes)} 个路由")
        EOF

    - name: API smoke test
      run: |
        python - <<'EOF'
        from fastapi.testclient import TestClient
        from backend.app import app
        from backend.database import init_db

        init_db()  # 显式初始化数据库（startup 事件在 TestClient 下不触发）
        client = TestClient(app)
        r = client.get("/health")
        assert r.status_code == 200 and r.json()["status"] == "ok", r.text
        print("✅ /health")

        # 管理接口已加 PIN 保护：未登录应 401
        r = client.get("/api/settings/llm")
        assert r.status_code == 401, (r.status_code, r.text)
        print("✅ /api/settings/llm 未登录返回 401（PIN 保护生效）")

        r = client.post("/api/auth/pin-login", json={"pin": "0000"})
        assert r.status_code == 401, r.text
        r = client.post("/api/auth/pin-login", json={"pin": "123456"})
        assert r.status_code == 200 and r.json()["success"], r.text
        print("✅ PIN 登录：错误 PIN 拒绝 / 正确 PIN 通过")

        r = client.get("/api/settings/llm")
        assert r.status_code == 200 and r.json()["success"], r.text
        print("✅ /api/settings/llm GET（登录后）")

        r = client.post("/api/settings/llm", json={"provider": "qwen", "api_key": "sk-ci-...0000"})
        assert r.status_code == 200 and r.json()["success"], r.text
        r = client.get("/api/settings/llm")
        assert r.json()["has_api_key"], r.text
        print("✅ /api/settings/llm POST + 回读")
        # 主备 provider 自动切换（PRD 第三节）
        r = client.get("/api/settings/fallback")
        assert r.status_code == 200 and r.json()["success"] and r.json()["provider"] is None, r.text
        r = client.post("/api/settings/fallback", json={"provider": "glm", "api_key": "fb-ci-0001"})
        assert r.status_code == 200 and r.json()["success"], r.text
        d = client.get("/api/settings/fallback").json()
        assert d["provider"] == "glm" and d["base_url"] == "https://open.bigmodel.cn/api/paas/v4" and d["model"] == "glm-4v", d
        assert d["has_api_key"], d
        r = client.post("/api/settings/fallback", json={"provider": "bad"})
        assert r.status_code == 400, r.text
        r = client.post("/api/settings/fallback", json={"provider": ""})
        assert r.status_code == 200 and "关闭" in r.json()["message"], r.text
        print("✅ /api/settings/fallback 主备 provider 配置")

        r = client.get("/api/auth/pin-status")
        assert r.status_code == 200 and r.json()["unlocked"], r.text
        r = client.post("/api/auth/pin-logout")
        assert r.status_code == 200, r.text
        r = client.get("/api/manage/classes")
        assert r.status_code == 401, r.text
        print("✅ 登出后管理接口恢复 401")

        r = client.get("/")
        assert r.status_code == 200, r.text
        # 手机端 5 秒预览倒计时（PRD 第五节）
        r = client.get("/mobile")
        assert r.status_code == 200, r.text
        for token in ["preview_ctl", "startCountdown", "cancelShot", "撤销重拍", "立即上传", "秒后自动上传"]:
            assert token in r.text, f"mobile 页缺少 {token}"
        print("✅ /mobile 预览倒计时元素齐全")
        r = client.get("/settings")
        assert r.status_code == 200, r.text
        assert "手机连接引导" in r.text, "设置页缺少手机连接引导卡片"
        for token in ["数据合规提示", "数据用于模型训练", "敏感信息遮盖", "本地存储"]:
            assert token in r.text, f"设置页缺少合规提示内容：{token}"
        for token in ["备用引擎（自动切换）", "备用服务商", "saveFallback"]:
            assert token in r.text, f"设置页缺少备用引擎卡片：{token}"
        print("✅ 设置页备用引擎卡片齐全")
        print("✅ 设置页数据合规提示卡片齐全")
        print("✅ 页面路由 / 与 /settings")

        r = client.get("/api/grading/failed")
        assert r.status_code == 200 and r.json()["success"] and r.json()["max_retry"] == 3, r.text
        print("✅ /api/grading/failed 失败队列接口")

        # 答案模板（PRD 4.4）：未登录 401，登录后可增删查
        r = client.post("/api/auth/pin-logout")
        assert r.status_code == 200, r.text
        r = client.get("/api/grading/answer-templates")
        assert r.status_code == 401, r.text
        client.post("/api/auth/pin-login", json={"pin": "123456"})
        r = client.post("/api/grading/answer-templates",
                        json={"title": "CI模板", "answers": {"1": "3/4", "2": "B"}})
        assert r.status_code == 200 and r.json()["success"], r.text
        tid = r.json()["id"]
        r = client.get("/api/grading/answer-templates")
        assert any(t["id"] == tid for t in r.json()["templates"]), r.text
        r = client.post("/api/grading/answer-templates", json={"title": "空", "answers": {}})
        assert r.status_code == 400, r.text
        r = client.delete(f"/api/grading/answer-templates/{tid}")
        assert r.status_code == 200, r.text
        print("✅ /api/grading/answer-templates 答案模板增删查")

        r = client.get("/api/network/info")
        assert r.status_code == 200 and r.json()["success"], r.text
        d = r.json()
        assert d["qr"].startswith("data:image/png;base64,") and d["url"].startswith("http://")
        print(f"✅ /api/network/info: ip={d['ip']} port={d['port']} 二维码已生成")

        print("🎉 API 冒烟测试全部通过")
        EOF

    - name: Template checks
      run: |
        for f in frontend/templates/index.html frontend/templates/mobile.html frontend/templates/settings.html; do
          test -f "$f" || { echo "❌ $f 不存在"; exit 1; }
          echo "✅ $f 存在"
        done

    - name: Project structure check
      run: |
        for f in main.py requirements.txt README.md backend/app.py backend/config.py backend/database.py backend/models/grading_engine.py backend/routes/grading.py backend/routes/settings.py; do
          test -f "$f" || { echo "❌ $f 不存在"; exit 1; }
          echo "✅ $f 存在"
        done


  build-windows:
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build exe with PyInstaller
      run: pyinstaller red_pen.spec --noconfirm

    - name: Verify artifact
      shell: pwsh
      run: |
        if (-not (Test-Path "dist/RedPen.exe")) { Write-Error "RedPen.exe not built"; exit 1 }
        Get-Item dist/RedPen.exe | Select-Object Name, Length
        if ((Get-Item dist/RedPen.exe).Length -lt 10MB) { Write-Error "exe too small"; exit 1 }

    - name: Upload Windows exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedPen-windows-x64
        path: dist/RedPen.exe
        retention-days: 14
