name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import checks
      run: |
        python - <<'EOF'
        from backend.config import settings
        print("✅ backend.config:", settings.HOST, settings.PORT)

        from backend.database import Base, SessionLocal
        print("✅ backend.database 模型定义完整")

        from backend.app import app
        print(f"✅ FastAPI应用创建成功, {len(app.routes)} 个路由")
        EOF

    - name: API smoke test
      run: |
        python - <<'EOF'
        from fastapi.testclient import TestClient
        from backend.app import app
        from backend.database import init_db

        init_db()  # 显式初始化数据库（startup 事件在 TestClient 下不触发）
        client = TestClient(app)
        r = client.get("/health")
        assert r.status_code == 200 and r.json()["status"] == "ok", r.text
        print("✅ /health")

        # 管理接口已加 PIN 保护：未登录应 401
        r = client.get("/api/settings/llm")
        assert r.status_code == 401, (r.status_code, r.text)
        print("✅ /api/settings/llm 未登录返回 401（PIN 保护生效）")

        r = client.post("/api/auth/pin-login", json={"pin": "0000"})
        assert r.status_code == 401, r.text
        r = client.post("/api/auth/pin-login", json={"pin": "123456"})
        assert r.status_code == 200 and r.json()["success"], r.text
        print("✅ PIN 登录：错误 PIN 拒绝 / 正确 PIN 通过")

        r = client.get("/api/settings/llm")
        assert r.status_code == 200 and r.json()["success"], r.text
        print("✅ /api/settings/llm GET（登录后）")

        r = client.post("/api/settings/llm", json={"provider": "qwen", "api_key": "sk-ci-...0000"})
        assert r.status_code == 200 and r.json()["success"], r.text
        r = client.get("/api/settings/llm")
        assert r.json()["has_api_key"], r.text
        print("✅ /api/settings/llm POST + 回读")

        r = client.get("/api/auth/pin-status")
        assert r.status_code == 200 and r.json()["unlocked"], r.text
        r = client.post("/api/auth/pin-logout")
        assert r.status_code == 200, r.text
        r = client.get("/api/manage/classes")
        assert r.status_code == 401, r.text
        print("✅ 登出后管理接口恢复 401")

        r = client.get("/")
        assert r.status_code == 200, r.text
        r = client.get("/settings")
        assert r.status_code == 200, r.text
        assert "手机连接引导" in r.text, "设置页缺少手机连接引导卡片"
        print("✅ 页面路由 / 与 /settings")

        r = client.get("/api/network/info")
        assert r.status_code == 200 and r.json()["success"], r.text
        d = r.json()
        assert d["qr"].startswith("data:image/png;base64,") and d["url"].startswith("http://")
        print(f"✅ /api/network/info: ip={d['ip']} port={d['port']} 二维码已生成")

        print("🎉 API 冒烟测试全部通过")
        EOF

    - name: Template checks
      run: |
        for f in frontend/templates/index.html frontend/templates/mobile.html frontend/templates/settings.html; do
          test -f "$f" || { echo "❌ $f 不存在"; exit 1; }
          echo "✅ $f 存在"
        done

    - name: Project structure check
      run: |
        for f in main.py requirements.txt README.md backend/app.py backend/config.py backend/database.py backend/models/grading_engine.py backend/routes/grading.py backend/routes/settings.py; do
          test -f "$f" || { echo "❌ $f 不存在"; exit 1; }
          echo "✅ $f 存在"
        done
