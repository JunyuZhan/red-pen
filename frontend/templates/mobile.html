<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红笔 · 拍照批改</title>
<style>
  :root { --brand:#e32d14; --brand-dark:#c0392b; --paper:#f6f5f4; --ink:#111; --stone:#757575; --hairline:1px solid rgba(0,0,0,0.08); --ok:#2e7d32; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:rgba(246,245,244,0.94); backdrop-filter:blur(8px); border-bottom:var(--hairline); padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header img { width:28px; height:28px; border-radius:7px; }
  header .t { font-weight:700; font-size:17px; letter-spacing:-0.2px; }
  header .t span { color:var(--brand); }
  header .badge { margin-left:auto; font-size:11px; color:var(--stone); border:var(--hairline); background:#fff; border-radius:9999px; padding:3px 10px; }
  .wrap { padding:16px 14px 32px; max-width:480px; margin:0 auto; }
  .card { background:#fff; border:var(--hairline); border-radius:14px; padding:20px; margin-bottom:14px; }
  h1 { font-size:22px; margin:0 0 2px; letter-spacing:-0.3px; }
  h1 b { color:var(--brand); }
  .sub { color:var(--stone); font-size:13px; margin-bottom:16px; }
  label { font-size:13px; color:#555; display:block; margin:10px 0 4px; }
  input[type=text], select { width:100%; padding:12px; border:var(--hairline); border-radius:10px; font-size:15px; margin-bottom:4px; background:#fff; color:var(--ink); appearance:none; background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
  input[type=text]:focus, select:focus { outline:2px solid rgba(227,45,20,0.25); border-color:var(--brand); }
  .shot { width:100%; border-radius:12px; margin:10px 0; display:none; border:var(--hairline); }
  button { width:100%; padding:14px; background:var(--brand); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; margin-top:8px; cursor:pointer; transition:transform .1s ease, opacity .2s; }
  button:active { transform:scale(0.98); }
  button.secondary { background:#f6f5f4; color:var(--brand); border:var(--hairline); }
  button.ghost-blue { background:#e6f3fe; color:#0075de; }
  button:disabled { opacity:.45; }
  .pick-zone { border:2px dashed rgba(227,45,20,0.35); border-radius:14px; padding:26px 14px; text-align:center; margin-top:14px; background:rgba(227,45,20,0.03); cursor:pointer; transition:background .2s; }
  .pick-zone:active { background:rgba(227,45,20,0.08); }
  .pick-zone .cam { font-size:34px; }
  .pick-zone .t1 { font-weight:700; margin-top:6px; }
  .pick-zone .t2 { font-size:12px; color:var(--stone); margin-top:2px; }
  #result { display:none; }
  #file { display:none !important; }
  #status { text-align:center; color:var(--stone); font-size:14px; margin-top:12px; min-height:20px; }
  #result h2 { font-size:17px; margin:4px 0 10px; }
  #annotated { width:100%; border-radius:12px; border:2px solid rgba(227,45,20,0.35); }
  .q { padding:11px 13px; border-left:4px solid #ccc; background:#fafaf9; border-radius:0 10px 10px 0; margin:8px 0; font-size:14px; line-height:1.6; }
  .q.correct { border-color:var(--ok); } .q.wrong { border-color:var(--brand); background:#fdf3f2; }
  .q .tag { font-weight:bold; } .q.correct .tag { color:var(--ok); } .q.wrong .tag { color:var(--brand); }
  #summary { font-size:14px; color:var(--brand-dark); background:#fdf3f2; padding:12px 14px; border-radius:10px; margin-top:12px; line-height:1.7; }
  #quality_warn { display:none; border:2px solid var(--brand); background:#fdf3f2; color:var(--brand); padding:14px; border-radius:12px; margin:12px 0; font-size:14px; }
  #quality_warn ul { margin:6px 0 10px; padding-left:18px; }
  footer { text-align:center; color:var(--stone); font-size:11px; padding:8px 0 4px; }
</style>
</head>
<body>
<header>
  <img src="/static/brand_logo.png" alt="logo" onerror="this.style.display='none'">
  <div class="t">红笔 <span>· 拍照批改</span></div>
  <div class="badge" id="queue_badge">🔒 数据仅存本机</div>
</header>
<div class="wrap">
<div class="card">
  <h1>拍下作业，<b>AI 批改</b></h1>
  <div class="sub">对准作业整页拍照，AI 自动逐题判定并红笔标注</div>

  <div id="uploadForm">
    <label>班级</label>
    <select id="class_sel" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:10px; background:#fff;"></select>
    <label>学生</label>
    <select id="student_sel" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:10px; background:#fff;"></select>
    <label>作业名称</label>
    <input type="text" id="assignment_name" placeholder="例：数学练习册 P23" value="随堂练习">
    <label>学科</label>
    <input type="text" id="subject" value="数学">
    <input type="file" id="file" accept="image/*" capture="environment" style="width:100%; margin:12px 0;">
    <img id="preview" class="shot" alt="预览">
    <div id="preview_ctl" style="display:none;">
      <div id="countdown" style="text-align:center; color:#c0392b; font-size:14px; margin:4px 0;"></div>
      <button class="secondary" onclick="cancelShot()">撤销重拍</button>
      <button onclick="upload()">立即上传</button>
    </div>
    <div class="pick-zone" onclick="document.getElementById('file').click()">
      <div class="cam">📷</div>
      <div class="t1">拍照 / 选图</div>
      <div class="t2">对准作业整页，光线充足效果更好</div>
    </div>
    </div>

  <div id="status"></div>
  <div id="quality_warn">
    <strong>⚠️ 照片质量提醒</strong>
    <ul id="quality_list"></ul>
    <button class="secondary" onclick="hideQualityWarning(); cancelShot();">📸 重拍</button>
    <button id="force_btn" style="display:none;" onclick="hideQualityWarning(); upload(true);">仍然使用此照片批改</button>
  </div>

  <div id="result">
    <h2 style="font-size:16px;">批改结果</h2>
    <img id="annotated" alt="红笔标注">
    <div id="summary"></div>
    <div id="questions"></div>
    <button class="secondary" onclick="reset()">再批一份</button>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
let submissionId = null, timer = null;
let classesData = [];

async function loadClasses() {
  try {
    const r = await fetch("/api/mobile/classes-students");
    const d = await r.json();
    classesData = d.classes || [];
  } catch (e) { classesData = []; }
  const cs = $("class_sel"), ss = $("student_sel");
  cs.innerHTML = "";
  if (!classesData.length) {
    cs.innerHTML = '<option value="">（暂无班级，工作台中创建）</option>';
    ss.innerHTML = '<option value="">（未关联学生）</option>';
    return;
  }
  classesData.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = c.name + "（" + c.students.length + "人）";
    cs.appendChild(o);
  });
  fillStudents();
}
function fillStudents() {
  const ss = $("student_sel");
  const c = classesData[$("class_sel").value] || {students: []};
  ss.innerHTML = "";
  if (!c.students.length) {
    ss.innerHTML = '<option value="">（该班暂无学生）</option>';
    return;
  }
  c.students.forEach(s => {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.name;
    ss.appendChild(o);
  });
}
$("class_sel").addEventListener("change", fillStudents);
loadClasses();

async function refreshQueueBadge() {
  try {
    const r = await fetch("/api/mobile/queue-counts");
    const d = await r.json();
    if (!d.success) return;
    const parts = [`已传 ${d.total}`, `批改 ${d.processing}`, `完成 ${d.completed}`];
    if (d.failed) parts.push(`失败 ${d.failed}`);
    $("queue_badge").textContent = parts.join(" · ");
    $("queue_badge").title = "🔒 数据仅存本机";
  } catch (e) { /* 忽略瞬时错误 */ }
}
refreshQueueBadge();
setInterval(refreshQueueBadge, 5000);

let cdTimer = null, cdLeft = 0;

$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const p = $("preview");
  p.src = URL.createObjectURL(f);
  p.style.display = "block";
  $("pick_btn").style.display = "none";
  $("preview_ctl").style.display = "block";
  startCountdown();
});

function startCountdown() {
  clearInterval(cdTimer);
  cdLeft = 5;
  const el = $("countdown");
  const tick = () => { el.textContent = `${cdLeft} 秒后自动上传…`; };
  tick();
  cdTimer = setInterval(() => {
    cdLeft--;
    if (cdLeft <= 0) { clearInterval(cdTimer); upload(); }
    else tick();
  }, 1000);
}

function cancelShot() {
  clearInterval(cdTimer);
  $("file").value = "";
  $("preview").style.display = "none";
  $("preview_ctl").style.display = "none";
  $("pick_btn").style.display = "block";
  $("countdown").textContent = "";
  setStatus("");
}

function setStatus(t) { $("status").textContent = t; }

function showQualityWarning(flags, uploaded) {
  const ul = $("quality_list");
  ul.innerHTML = "";
  flags.forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); });
  $("quality_warn").style.display = "block";
  if (uploaded) { // 已强行上传后仅提示，不阻断
    $("force_btn").style.display = "none";
  } else {
    $("force_btn").style.display = "block";
    setStatus("");
  }
  $("quality_warn").scrollIntoView({ behavior: "smooth" });
}
function hideQualityWarning() { $("quality_warn").style.display = "none"; }

async function upload(force) {
  const file = $("file").files[0];
  if (!file) { setStatus("请先拍照或选择图片"); return; }
  const fd = new FormData();
  fd.append("file", file);
  fd.append("assignment_name", $("assignment_name").value || "随堂练习");
  fd.append("stage", "小学");
  fd.append("subject", $("subject").value || "数学");
  fd.append("teacher_id", "1");
  const sid = $("student_sel").value;
  if (sid) fd.append("student_id", sid);
  if (force) fd.append("force_quality", "1");

  setStatus("上传中…");
  hideQualityWarning();
  clearInterval(cdTimer);
  $("preview_ctl").style.display = "none";
  $("countdown").textContent = "";
  try {
    const r = await fetch("/api/upload/upload-mobile", { method: "POST", body: fd });
    const d = await r.json();
    if (r.status === 422 && d.quality_flags) { showQualityWarning(d.quality_flags); return; }
    if (!d.success) throw new Error(d.detail || d.message);
    if (d.quality_flags && d.quality_flags.length) showQualityWarning(d.quality_flags, true);
    submissionId = d.submission_id;
    setStatus("已上传，AI 批改中…（约 10-30 秒）");
    $("uploadForm").style.display = "none";
    timer = setInterval(poll, 3000);
  } catch (e) { setStatus("❌ " + e.message); }
}

async function poll() {
  try {
    const r = await fetch("/api/grading/result/" + submissionId);
    const d = await r.json();
    if (d.status === "completed") { clearInterval(timer); show(d); }
    else if (d.status === "failed") {
      clearInterval(timer);
      setStatus("❌ 批改失败" + (d.error_message ? `：${friendlyError(d.error_message)}` : "，请检查设置页的 API Key")
        + "，请联系教师在电脑端重试"); }
  } catch (e) { /* 忽略瞬时错误 */ }
}

function show(d) {
  setStatus("");
  $("summary").textContent = "📌 " + (d.summary || "批改完成");
  if (d.annotated_image_url) {
    $("annotated").src = d.annotated_image_url + "?t=" + Date.now();
    $("annotated").style.display = "block";
  }
  const box = $("questions");
  box.innerHTML = "";
  (d.results || []).forEach(q => {
    const div = document.createElement("div");
    div.className = "q " + (q.judgement || "");
    const tag = { correct: "✓ 正确", wrong: "✗ 错误", partial: "◐ 部分", unclear: "? 待定" }[q.judgement] || "?";
    let html = `<div class="tag">第${q.question_no}题 · ${tag}</div>`;
    if (q.error_type) html += `<div>错误类型：${q.error_type}</div>`;
    if (q.student_answer) html += `<div>学生答案：${q.student_answer}</div>`;
    if (q.correct_answer) html += `<div>参考答案：${q.correct_answer}</div>`;
    div.innerHTML = html;
    box.appendChild(div);
  });
  $("result").style.display = "block";
}

function reset() {
  $("result").style.display = "none";
  $("uploadForm").style.display = "block";
  $("file").value = "";
  $("preview").style.display = "none";
  $("preview_ctl").style.display = "none";
  $("pick_btn").style.display = "block";
  $("countdown").textContent = "";
  $("questions").innerHTML = "";
  setStatus("");
}
</script>
<footer id="mFooter">红笔 RedPen · 开发者 詹俊宇 · 数据仅存本机</footer>
<script>
fetch("/health").then(r=>r.json()).then(d=>{ if(d.version) document.getElementById("mFooter").textContent = "红笔 RedPen " + d.version + " · 开发者 詹俊宇 · 数据仅存本机"; }).catch(()=>{});
</script>

<script>
// 把技术报错翻译成老师能看懂的话
function friendlyError(msg){
  msg = msg || "";
  if (/401|Unauthorized|invalid.*key|无效的密钥|authentication/i.test(msg)) return "API Key 无效或已失效——请到设置页检查 Key 是否粘贴完整，必要时重新生成";
  if (/402|insufficient|balance|余额/i.test(msg)) return "模型账户余额不足——请到模型官网充值后重试（余额永久有效）";
  if (/429|rate.?limit|限流/i.test(msg)) return "请求太快被限流——等 1 分钟后点重试即可";
  if (/timeout|timed? ?out|超时/i.test(msg)) return "网络超时——检查电脑网络和 VPN/代理设置后重试";
  if (/connection|connect|refused|network|网络/i.test(msg)) return "网络连接失败——检查电脑能否上网，以及防火墙是否放行";
  if (/vision|image|multimodal|不支持.*图|视觉/i.test(msg)) return "当前模型不支持图片识别——请到设置页换用支持视觉的模型（可点测试连接验证）";
  if (/quality|模糊|blur/i.test(msg)) return "照片质量不达标——请在光线充足处对准作业整页重新拍摄";
  return msg;
}
</script>

</body>
</html>
