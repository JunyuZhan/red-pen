<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红笔 · 拍照批改</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f5f6f8; margin:0; padding:16px; }
  .card { max-width:480px; margin:0 auto; background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.07); }
  h1 { font-size:20px; color:#c0392b; margin:0 0 2px; }
  .sub { color:#999; font-size:13px; margin-bottom:16px; }
  input[type=text] { width:100%; box-sizing:border-box; padding:11px; border:1px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:10px; }
  label { font-size:13px; color:#555; }
  .shot { width:100%; border-radius:10px; margin:10px 0; display:none; }
  button { width:100%; padding:14px; background:#c0392b; color:#fff; border:none; border-radius:10px; font-size:16px; margin-top:8px; cursor:pointer; }
  button.secondary { background:#eee; color:#c0392b; }
  button:disabled { opacity:.5; }
  #status { text-align:center; color:#888; font-size:14px; margin-top:12px; min-height:20px; }
  #result { display:none; }
  #annotated { width:100%; border-radius:10px; border:2px solid #f2c1bc; }
  .q { padding:10px 12px; border-left:4px solid #ccc; background:#fafafa; border-radius:0 8px 8px 0; margin:8px 0; font-size:14px; }
  .q.correct { border-color:#2e7d32; } .q.wrong { border-color:#c0392b; background:#fdf3f2; }
  .q .tag { font-weight:bold; } .q.correct .tag { color:#2e7d32; } .q.wrong .tag { color:#c0392b; }
  #summary { font-size:14px; color:#c0392b; background:#fdf3f2; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #quality_warn { display:none; border:2px solid #c0392b; background:#fdf3f2; color:#c0392b; padding:12px; border-radius:10px; margin:12px 0; font-size:14px; }
  #quality_warn ul { margin:6px 0 10px; padding-left:18px; }
</style>
</head>
<body>
<div class="card">
  <h1>红笔 · 拍照批改</h1>
  <div class="sub">拍下作业，AI 帮你逐题批改</div>

  <div id="uploadForm">
    <label>班级</label>
    <select id="class_sel" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:10px; background:#fff;"></select>
    <label>学生</label>
    <select id="student_sel" style="width:100%; box-sizing:border-box; padding:11px; border:1px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:10px; background:#fff;"></select>
    <label>作业名称</label>
    <input type="text" id="assignment_name" placeholder="例：数学练习册 P23" value="随堂练习">
    <label>学科</label>
    <input type="text" id="subject" value="数学">
    <input type="file" id="file" accept="image/*" capture="environment" style="width:100%; margin:12px 0;">
    <img id="preview" class="shot" alt="预览">
    <div id="preview_ctl" style="display:none;">
      <div id="countdown" style="text-align:center; color:#c0392b; font-size:14px; margin:4px 0;"></div>
      <button class="secondary" onclick="cancelShot()">撤销重拍</button>
      <button onclick="upload()">立即上传</button>
    </div>
    <button id="pick_btn" onclick="document.getElementById('file').click()" style="background:#eee; color:#c0392b;">📷 拍照 / 选图</button>
    </div>

  <div id="status"></div>
  <div id="quality_warn">
    <strong>⚠️ 照片质量提醒</strong>
    <ul id="quality_list"></ul>
    <button class="secondary" onclick="hideQualityWarning(); cancelShot();">📸 重拍</button>
    <button id="force_btn" style="display:none;" onclick="hideQualityWarning(); upload(true);">仍然使用此照片批改</button>
  </div>

  <div id="result">
    <h2 style="font-size:16px;">批改结果</h2>
    <img id="annotated" alt="红笔标注">
    <div id="summary"></div>
    <div id="questions"></div>
    <button class="secondary" onclick="reset()">再批一份</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let submissionId = null, timer = null;
let classesData = [];

async function loadClasses() {
  try {
    const r = await fetch("/api/mobile/classes-students");
    const d = await r.json();
    classesData = d.classes || [];
  } catch (e) { classesData = []; }
  const cs = $("class_sel"), ss = $("student_sel");
  cs.innerHTML = "";
  if (!classesData.length) {
    cs.innerHTML = '<option value="">（暂无班级，工作台中创建）</option>';
    ss.innerHTML = '<option value="">（未关联学生）</option>';
    return;
  }
  classesData.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = c.name + "（" + c.students.length + "人）";
    cs.appendChild(o);
  });
  fillStudents();
}
function fillStudents() {
  const ss = $("student_sel");
  const c = classesData[$("class_sel").value] || {students: []};
  ss.innerHTML = "";
  if (!c.students.length) {
    ss.innerHTML = '<option value="">（该班暂无学生）</option>';
    return;
  }
  c.students.forEach(s => {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.name;
    ss.appendChild(o);
  });
}
$("class_sel").addEventListener("change", fillStudents);
loadClasses();

let cdTimer = null, cdLeft = 0;

$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const p = $("preview");
  p.src = URL.createObjectURL(f);
  p.style.display = "block";
  $("pick_btn").style.display = "none";
  $("preview_ctl").style.display = "block";
  startCountdown();
});

function startCountdown() {
  clearInterval(cdTimer);
  cdLeft = 5;
  const el = $("countdown");
  const tick = () => { el.textContent = `${cdLeft} 秒后自动上传…`; };
  tick();
  cdTimer = setInterval(() => {
    cdLeft--;
    if (cdLeft <= 0) { clearInterval(cdTimer); upload(); }
    else tick();
  }, 1000);
}

function cancelShot() {
  clearInterval(cdTimer);
  $("file").value = "";
  $("preview").style.display = "none";
  $("preview_ctl").style.display = "none";
  $("pick_btn").style.display = "block";
  $("countdown").textContent = "";
  setStatus("");
}

function setStatus(t) { $("status").textContent = t; }

function showQualityWarning(flags, uploaded) {
  const ul = $("quality_list");
  ul.innerHTML = "";
  flags.forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); });
  $("quality_warn").style.display = "block";
  if (uploaded) { // 已强行上传后仅提示，不阻断
    $("force_btn").style.display = "none";
  } else {
    $("force_btn").style.display = "block";
    setStatus("");
  }
  $("quality_warn").scrollIntoView({ behavior: "smooth" });
}
function hideQualityWarning() { $("quality_warn").style.display = "none"; }

async function upload(force) {
  const file = $("file").files[0];
  if (!file) { setStatus("请先拍照或选择图片"); return; }
  const fd = new FormData();
  fd.append("file", file);
  fd.append("assignment_name", $("assignment_name").value || "随堂练习");
  fd.append("stage", "小学");
  fd.append("subject", $("subject").value || "数学");
  fd.append("teacher_id", "1");
  const sid = $("student_sel").value;
  if (sid) fd.append("student_id", sid);
  if (force) fd.append("force_quality", "1");

  setStatus("上传中…");
  hideQualityWarning();
  clearInterval(cdTimer);
  $("preview_ctl").style.display = "none";
  $("countdown").textContent = "";
  try {
    const r = await fetch("/api/upload/upload-mobile", { method: "POST", body: fd });
    const d = await r.json();
    if (r.status === 422 && d.quality_flags) { showQualityWarning(d.quality_flags); return; }
    if (!d.success) throw new Error(d.detail || d.message);
    if (d.quality_flags && d.quality_flags.length) showQualityWarning(d.quality_flags, true);
    submissionId = d.submission_id;
    setStatus("已上传，AI 批改中…（约 10-30 秒）");
    $("uploadForm").style.display = "none";
    timer = setInterval(poll, 3000);
  } catch (e) { setStatus("❌ " + e.message); }
}

async function poll() {
  try {
    const r = await fetch("/api/grading/result/" + submissionId);
    const d = await r.json();
    if (d.status === "completed") { clearInterval(timer); show(d); }
    else if (d.status === "failed") {
      clearInterval(timer);
      setStatus("❌ 批改失败" + (d.error_message ? `：${d.error_message}` : "，请检查设置页的 API Key")
        + "，请联系教师在电脑端重试"); }
  } catch (e) { /* 忽略瞬时错误 */ }
}

function show(d) {
  setStatus("");
  $("summary").textContent = "📌 " + (d.summary || "批改完成");
  if (d.annotated_image_url) {
    $("annotated").src = d.annotated_image_url + "?t=" + Date.now();
    $("annotated").style.display = "block";
  }
  const box = $("questions");
  box.innerHTML = "";
  (d.results || []).forEach(q => {
    const div = document.createElement("div");
    div.className = "q " + (q.judgement || "");
    const tag = { correct: "✓ 正确", wrong: "✗ 错误", partial: "◐ 部分", unclear: "? 待定" }[q.judgement] || "?";
    let html = `<div class="tag">第${q.question_no}题 · ${tag}</div>`;
    if (q.error_type) html += `<div>错误类型：${q.error_type}</div>`;
    if (q.student_answer) html += `<div>学生答案：${q.student_answer}</div>`;
    if (q.correct_answer) html += `<div>参考答案：${q.correct_answer}</div>`;
    div.innerHTML = html;
    box.appendChild(div);
  });
  $("result").style.display = "block";
}

function reset() {
  $("result").style.display = "none";
  $("uploadForm").style.display = "block";
  $("file").value = "";
  $("preview").style.display = "none";
  $("preview_ctl").style.display = "none";
  $("pick_btn").style.display = "block";
  $("countdown").textContent = "";
  $("questions").innerHTML = "";
  setStatus("");
}
</script>
</body>
</html>
