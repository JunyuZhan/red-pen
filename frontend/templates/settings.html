<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 - 红笔</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 0 0 4px; color: #c0392b; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 14px; color: #444; margin: 14px 0 6px; }
  select, input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  button { width: 100%; margin-top: 22px; padding: 12px; background: #c0392b; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #a93226; }
  .msg { margin-top: 14px; font-size: 14px; min-height: 18px; }
  .ok { color: #27ae60; } .err { color: #c0392b; }
</style>
</head>
<body>
<div class="card">
  <h1>批改引擎设置</h1>
  <div class="sub">选择 AI 服务商并填写 API Key，Key 保存在本机数据库，不会上传到任何第三方。</div>

  <label>服务商</label>
  <select id="provider" onchange="onProviderChange()">
    <option value="qwen">通义千问（阿里云百炼）</option>
    <option value="glm">智谱 GLM（bigmodel）</option>
    <option value="custom">自定义（OpenAI 兼容接口）</option>
  </select>

  <label>API Base URL</label>
  <input id="base_url" placeholder="选服务商后自动填充">
  <div class="hint">自定义服务商时必填，一般以 /v1 结尾</div>

  <label>模型名称</label>
  <input id="model" placeholder="选服务商后自动填充">

  <label>API Key</label>
  <input id="api_key" type="password" placeholder="">
  <div class="hint" id="key_hint"></div>

  <button onclick="save()">保存配置</button>
  <div class="msg" id="msg"></div>
</div>

<div class="card" style="margin-top:20px">
  <h1>成本单价配置</h1>
  <div class="sub">配置每 1K tokens 的单价（元），用于估算批改花费，仅保存在本机。</div>

  <label>输入单价（元 / 1K tokens）</label>
  <input id="cost_input" type="number" step="0.01" min="0" placeholder="如 0.8">

  <label>输出单价（元 / 1K tokens）</label>
  <input id="cost_output" type="number" step="0.01" min="0" placeholder="如 2.0">

  <button onclick="saveCost()">保存单价</button>
  <div class="msg" id="cost_msg"></div>
</div>

<script>
const defaults = {
  qwen:   { base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1", model: "qwen-vl-plus" },
  glm:    { base_url: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4v" },
  custom: { base_url: "", model: "" }
};

function onProviderChange() {
  const p = document.getElementById("provider").value;
  document.getElementById("base_url").value = defaults[p].base_url;
  document.getElementById("model").value = defaults[p].model;
}

async function load() {
  const r = await fetch("/api/settings/llm");
  const d = await r.json();
  document.getElementById("provider").value = d.provider;
  document.getElementById("base_url").value = d.base_url;
  document.getElementById("model").value = d.model;
  document.getElementById("key_hint").textContent =
    d.has_api_key ? "已保存 Key：" + d.api_key_masked + "（留空即不修改）" : "尚未配置 Key";
}

async function save() {
  const msg = document.getElementById("msg");
  const body = {
    provider: document.getElementById("provider").value,
    base_url: document.getElementById("base_url").value,
    model: document.getElementById("model").value,
    api_key: document.getElementById("api_key").value
  };
  try {
    const r = await fetch("/api/settings/llm", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.detail || d.error || "保存失败");
    msg.className = "msg ok"; msg.textContent = "✅ " + d.message;
    document.getElementById("api_key").value = "";
    load();
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "❌ " + e.message;
  }
}

async function loadCost() {
  const r = await fetch("/api/settings/cost");
  const d = await r.json();
  if (d.success) {
    document.getElementById("cost_input").value = d.input;
    document.getElementById("cost_output").value = d.output;
  }
}

async function saveCost() {
  const msg = document.getElementById("cost_msg");
  const body = {
    cost_input_per_1k: parseFloat(document.getElementById("cost_input").value),
    cost_output_per_1k: parseFloat(document.getElementById("cost_output").value)
  };
  if (isNaN(body.cost_input_per_1k) || isNaN(body.cost_output_per_1k) ||
      body.cost_input_per_1k < 0 || body.cost_output_per_1k < 0) {
    msg.className = "msg err"; msg.textContent = "❌ 请填写不小于 0 的数字单价";
    return;
  }
  try {
    const r = await fetch("/api/settings/cost", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.detail || d.error || "保存失败");
    msg.className = "msg ok"; msg.textContent = "✅ " + d.message;
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "❌ " + e.message;
  }
}

load();
loadCost();
</script>
</body>
</html>
