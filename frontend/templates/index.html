<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红笔 · 教师工作台</title>
<style>
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6f8; margin:0; padding:24px; }
  .wrap { max-width:960px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  h1 { font-size:22px; color:#c0392b; margin:0; }
  a.btn { padding:9px 16px; background:#fff; color:#c0392b; border:1px solid #e5b7b1; border-radius:8px; text-decoration:none; font-size:14px; }
  .stats { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { flex:1; min-width:130px; background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .stat b { font-size:24px; color:#c0392b; display:block; }
  .stat span { color:#888; font-size:13px; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); margin-bottom:20px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:10px 8px; border-bottom:1px solid #f0f0f0; }
  th { color:#888; font-weight:normal; }
  .pill { padding:3px 10px; border-radius:20px; font-size:12px; }
  .pill.completed { background:#e8f5e9; color:#2e7d32; }
  .pill.failed { background:#fdf3f2; color:#c0392b; }
  .pill.processing, .pill.uploaded { background:#fff8e1; color:#b28704; }
  .hint { color:#999; font-size:13px; }
  img.result { max-width:100%; border:2px solid #f2c1bc; border-radius:10px; }
  .mgr input { padding:7px 10px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
  .mgr button { padding:7px 14px; border:1px solid #e5b7b1; background:#fff; color:#c0392b; border-radius:8px; cursor:pointer; font-size:13px; }
  .mgr select { padding:7px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
  .cls-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; }
  .tag { display:inline-block; padding:3px 10px; border-radius:14px; background:#fdf3f2; color:#c0392b; font-size:13px; margin:2px 4px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>红笔 · 教师工作台</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button id="ctxBtn" onclick="openWizard('switch')" style="padding:9px 14px;background:#fdf3f2;color:#c0392b;border:1px solid #e5b7b1;border-radius:8px;font-size:14px;cursor:pointer;">🏫 <span id="ctxLabel">加载中…</span> ▾</button>
      <a class="btn" href="/settings">⚙️ 批改引擎设置</a>
      <a class="btn" href="/mobile">📱 手机上传</a>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px;">提交记录
      <button id="batchBtn" onclick="startBatch()" style="float:right;padding:6px 14px;background:#c0392b;color:#fff;border:none;border-radius:8px;cursor:pointer;">🚀 一键批改全部待批</button>
    </h2>
    <p class="hint" id="queueHint" style="display:none;margin:0 0 8px;"></p>
    <table>
      <thead><tr><th>ID</th><th>状态</th><th>总评</th><th>查看</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="hint">加载中…</td></tr></tbody>
    </table>
    <p class="hint" id="emptyHint" style="display:none;">暂无提交记录 —— 用手机端拍照上传开始批改</p>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px;">一键体验演示 <span class="hint">（没填 AI Key 也能先看完整流程）</span></h2>
    <p class="hint" style="margin:0 0 10px;">生成一个「【演示】一年级1班」和演示作业，判定为内置示例数据（<b>非 AI 批改</b>），可随时一键清除，不影响真实班级。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="demoSeed()">🎬 生成演示数据</button>
      <button onclick="demoClear()" style="background:#fff;color:#555;border:1px solid #ddd;">🗑 清除演示数据</button>
    </div>
    <p id="demoMsg" class="hint" style="margin:8px 0 0;color:#c0392b;"></p>
  </div>

  <div class="card mgr">
    <h2 style="font-size:16px;margin:0 0 12px;">班级 / 学生管理</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <input id="newClassName" placeholder="新班级名称">
      <button onclick="addClass()">➕ 添加班级</button>
    </div>
    <div id="classList"></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <input id="newStudentName" placeholder="学生姓名">
      <select id="studentClassSel"></select>
      <button onclick="addStudent()">➕ 添加学生</button>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px;">答案模板 <span class="hint">（同一练习册答案存一次，批改时复用）</span></h2>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <select id="tplSubject" style="padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;">
      <option>数学</option><option>语文</option><option>英语</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option><option>道德与法治</option><option>其他</option>
    </select>
    <input id="tplTitle" placeholder="模板名称，例：练习册 P23" style="flex:1;min-width:200px;">
    </div>
    <textarea id="tplAnswers" placeholder="每行一条：题号=答案&#10;例：&#10;1=3/4&#10;2=B&#10;3=24" rows="4" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;"></textarea>
    <div style="margin-top:8px;"><button onclick="addTemplate()">➕ 保存模板</button></div>
    <div id="tplList" style="margin-top:12px;"></div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
      <span class="hint">批改用模板：</span>
      <select id="gradeTplSel"><option value="">不使用（AI 自行读题）</option></select>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px;">学情分析</h2>
    <div id="analyticsBody"><p class="hint">加载中…</p></div>
  </div>

  <div class="card" id="detail" style="display:none;">
    <h2 style="font-size:16px;margin:0 0 12px;">批改详情
      <button id="exportCsvBtn" style="float:right;display:none;" onclick="exportCsv()">导出 Excel(CSV)</button></h2>
    <img id="detailImg" class="result" alt="红笔标注">
    <div id="detailBody" style="margin-top:12px;font-size:14px;"></div>
  </div>
</div>

<!-- 首次三步引导 / 上下文切换浮层 -->
<div id="wizGate" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:98;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.2);">
    <h2 id="wizTitle" style="font-size:17px;margin:0 0 4px;color:#c0392b;">👋 欢迎使用红笔</h2>
    <p class="hint" id="wizSub" style="margin:0 0 14px;">三步完成初始设置（随时可在右上角切换）</p>
    <p id="wizStepLabel" class="hint" style="margin:0 0 8px;"></p>
    <div id="wizOptions" style="display:flex;flex-wrap:wrap;gap:8px;min-height:44px;"></div>
    <div id="wizCustomRow" style="display:none;margin-top:10px;">
      <input id="wizCustomInput" placeholder="或输入新班级名称，例：三年二班" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:14px;">
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;">
      <button id="wizBackBtn" onclick="wizBack()" style="padding:9px 16px;border:1px solid #ddd;background:#fff;color:#555;border-radius:8px;cursor:pointer;">上一步</button>
      <button id="wizNextBtn" onclick="wizNext()" style="padding:9px 16px;background:#c0392b;color:#fff;border:none;border-radius:8px;cursor:pointer;">下一步</button>
    </div>
    <p id="wizMsg" class="hint" style="min-height:16px;margin:10px 0 0;color:#c0392b;"></p>
  </div>
</div>

<!-- 管理员 PIN 解锁浮层 -->
<div id="pinGate" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,.2);">
    <h2 style="font-size:17px;margin:0 0 6px;color:#c0392b;">🔒 需要管理员 PIN</h2>
    <p class="hint" style="margin:0 0 14px;">管理功能已加锁保护，请输入管理员 PIN 解锁。</p>
    <input id="pinInput" type="password" inputmode="numeric" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;"
           placeholder="管理员 PIN" onkeydown="if(event.key==='Enter')pinUnlock()">
    <button onclick="pinUnlock()" style="width:100%;margin-top:14px;padding:11px;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">解锁</button>
    <p id="pinMsg" class="hint" style="min-height:16px;margin:10px 0 0;color:#c0392b;"></p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function load() {
  const s = await (await fetch("/api/dashboard/summary")).json();
  $("stats").innerHTML = `
    <div class="stat"><b>${s.total_submissions}</b><span>总提交数</span></div>
    <div class="stat"><b>${s.completed}</b><span>已批改</span></div>
    <div class="stat"><b>${s.failed}</b><span>失败</span></div>
    <div class="stat"><b>${s.total_questions}</b><span>批改题数</span></div>
    <div class="stat"><b>${s.accuracy == null ? "-" : (s.accuracy*100).toFixed(0)+"%"}</b><span>正确率</span></div>`;
  const ag = (s.assignment_grades || []).filter(a => a.grade);
  if (ag.length) {
    const old = document.getElementById("assignmentGrades");
    if (old) old.remove();
    const div = document.createElement("div");
    div.id = "assignmentGrades";
    div.style.cssText = "margin-top:10px;font-size:13px;color:#555;";
    div.innerHTML = "📋 作业等级：" + ag.map(a =>
      `<span style="display:inline-block;margin:2px 8px 2px 0;padding:2px 10px;border-radius:8px;background:#f0ead8;color:#6b5b2e;">${a.title || ("作业"+a.assignment_id)} <b>${a.grade}</b>（${(a.accuracy*100).toFixed(0)}%）</span>`).join("");
    $("stats").after(div);
  }
  // 按作业导出全班成绩单（每行一名学生）
  const allAsg = s.assignment_grades || [];
  if (allAsg.length) {
    const old2 = document.getElementById("classExportBar");
    if (old2) old2.remove();
    const bar = document.createElement("div");
    bar.id = "classExportBar";
    bar.style.cssText = "margin-top:8px;font-size:13px;color:#555;";
    bar.innerHTML = "📄 导出全班成绩单："
      + `<button style="margin:2px 8px 2px 0;" onclick="window.location.href='/api/grading/export-class-all?days=30'">近30天汇总</button>`
      + `<button style="margin:2px 8px 2px 0;" onclick="window.location.href='/api/grading/export-class-all?days=0'">全部汇总</button>`
      + `<button style="margin:2px 8px 2px 0;" onclick="window.location.href='/api/grading/export-wrong-all?days=0'">错题讲评清单</button>`
      + `<select id="studentWrongSel" style="margin:2px 4px 2px 0;padding:2px 4px;">`
      + `<option value="">选学生</option>`
      + (s.students || []).map(st => `<option value="${st.id}">${st.name}</option>`).join("")
      + `</select>`
      + `<button style="margin:2px 8px 2px 0;" onclick="exportStudentWrong()">学生错题本</button>`
      + (s.classes || []).map(c =>
      `<button style="margin:2px 6px 2px 0;" onclick="window.location.href='/api/grading/export-class-all?days=30&class_id=${c.id}'">近30天·${c.name}</button>`).join("")
      + allAsg.map(a =>
      `<button style="margin:2px 6px 2px 0;" onclick="window.location.href='/api/grading/export-class/${a.assignment_id}'">成绩单:${a.title || ("作业"+a.assignment_id)}</button>`
      + `<button style="margin:2px 6px 2px 0;" onclick="window.location.href='/api/grading/export-question-matrix/${a.assignment_id}'">得分矩阵:${a.title || ("作业"+a.assignment_id)}</button>`).join("");
    (document.getElementById("assignmentGrades") || $("stats")).after(bar);
  }
}

function exportStudentWrong() {
  const sel = document.getElementById("studentWrongSel");
  const id = sel && sel.value;
  if (!id) { alert("请先在下拉框选择学生"); return; }
  window.location.href = "/api/grading/export-student/" + id + "?days=0";
}

async function demoSeed() {
  if (!(await ensureAdmin())) return;
  const msg = $("demoMsg"); msg.textContent = "正在生成演示数据…";
  const r = await fetch("/api/demo/seed", { method: "POST" });
  if (r.ok) {
    const d = await r.json();
    msg.textContent = "✅ 演示数据已生成（判定为内置示例，非 AI 批改）。刷新列表查看，体验完可一键清除。";
    loadRows(); load();
  } else if (r.status === 401) {
    msg.textContent = "请先解锁管理员 PIN";
  } else {
    msg.textContent = "生成失败：" + ((await r.json()).detail || r.status);
  }
}

async function demoClear() {
  if (!(await ensureAdmin())) return;
  if (!confirm("确定清除所有【演示】数据？（不影响真实班级）")) return;
  const msg = $("demoMsg"); msg.textContent = "正在清除…";
  const r = await fetch("/api/demo/clear", { method: "POST" });
  if (r.ok) {
    msg.textContent = "✅ 演示数据已清除。";
    loadRows(); load();
  } else if (r.status === 401) {
    msg.textContent = "请先解锁管理员 PIN";
  } else {
    msg.textContent = "清除失败：" + ((await r.json()).detail || r.status);
  }
}

async function loadRows() {
  const r = await fetch("/api/mobile/list");
  const d = await r.json();
  const rows = d.submissions || [];
  $("emptyHint").style.display = rows.length ? "none" : "block";
  $("rows").innerHTML = rows.map(x => {
    const gradeBadge = x.grade ? `<span style="display:inline-block;padding:1px 8px;border-radius:8px;background:#f0ead8;color:#6b5b2e;font-weight:bold;margin-right:6px;">${x.grade}</span>` : "";
    return `
  <tr>
    <td>${x.id}</td>
    <td><span class="pill ${x.status}">${x.status}</span>${x.status === "failed" ? `<br><span class="hint">${friendlyError((x.error_message || "")).slice(0, 80) || "未知原因"}${(x.retry_count || 0) ? ` · 已重试 ${x.retry_count} 次` : ""}</span>` : ""}</td>
    <td>${gradeBadge}${x.summary || "-"}</td>
      <td>${x.status === "completed" ? `<a href="#" onclick="view(${x.id});return false;">查看详情</a>`
        : x.status === "uploaded" ? `<a href="#" onclick="startGrading(${x.id});return false;">开始批改</a>`
        : x.status === "failed" ? `<a href="#" onclick="retry(${x.id});return false;">重试</a>` : "-"}</td>
    </tr>`;}).join("");
}

async function retry(id) {
  if (!confirm(`确定重试第 ${id} 份提交？`)) return;
  const r = await fetch(`/api/grading/retry/${id}`, { method: "POST" });
  const d = await r.json();
  if (!r.ok || d.success === false) return alert(friendlyError(d.detail || d.error) || "重试失败");
  loadRows(); load();
}

async function startGrading(id) {
  const tpl = $("gradeTplSel").value;
  const q = tpl ? `?template_id=${tpl}` : "";
  const r = await fetch(`/api/grading/start/${id}${q}`, { method: "POST" });
  const d = await r.json();
  if (!r.ok || d.success === false) return alert(friendlyError(d.detail || d.error) || "批改失败");
  loadRows(); load(); pollQueue();
}

async function startBatch() {
  const tpl = $("gradeTplSel").value;
  const body = tpl ? { template_id: parseInt(tpl) } : {};
  $("batchBtn").disabled = true;
  const r = await fetch("/api/grading/batch", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  const d = await r.json();
  $("batchBtn").disabled = false;
  if (!r.ok || d.success === false) return alert(d.detail || d.error || "批量批改启动失败");
  if (!d.count) { alert("当前没有待批改的提交"); return; }
  pollQueue();
}

let _pollTimer = null;
async function pollQueue() {
  const r = await fetch("/api/grading/queue-status");
  if (!r.ok) return;
  const d = await r.json();
  const c = d.counts || {};
  const hint = $("queueHint");
  if (c.queued + c.processing > 0) {
    hint.style.display = "block";
    hint.textContent = `⏳ 批改队列：排队 ${c.queued} 份 · 处理中 ${c.processing} 份（并发 ${d.concurrency} 路）` +
      (c.completed ? ` · 已完成 ${c.completed} 份` : "") + (c.failed ? ` · 失败 ${c.failed} 份` : "") +
      (d.avg_duration_seconds ? ` · 平均单份 ${d.avg_duration_seconds}s` : "");
    clearTimeout(_pollTimer);
    _pollTimer = setTimeout(pollQueue, 3000);
    loadRows();
  } else {
    if (hint.style.display === "block") {
      hint.style.display = "block";
      hint.textContent = `✅ 本轮批改完成：成功 ${c.completed} 份` +
        (c.failed ? ` · 失败 ${c.failed} 份（可在列表中重试）` : "") +
        (d.avg_duration_seconds ? ` · 平均单份 ${d.avg_duration_seconds}s` : "");
    }
    loadRows(); load();
  }
}

// ---------- 答案模板 ----------
async function loadTemplates() {
  const r = await fetch("/api/grading/answer-templates");
  if (r.status === 401) { $("tplList").innerHTML = '<p class="hint">🔒 输入 PIN 解锁后可管理答案模板</p>'; return; }
  const d = await r.json();
  const list = d.templates || [];
  const sel = $("gradeTplSel");
  sel.innerHTML = '<option value="">不使用（AI 自行读题）</option>' +
    list.map(t => `<option value="${t.id}">${t.title}（已用 ${t.usage_count} 次）</option>`).join("");
  $("tplList").innerHTML = list.length ? list.map(t =>
    `<div class="cls-item"><span><b>${t.title}</b> · [${t.subject}] ${Object.keys(t.answers).length} 题 · 已用 ${t.usage_count} 次</span>
     <button onclick="delTemplate(${t.id})">删除</button></div>`).join("")
    : '<p class="hint">暂无模板</p>';
}
async function addTemplate() {
  const title = $("tplTitle").value.trim();
  const raw = $("tplAnswers").value.trim();
  if (!title || !raw) return alert("请填写模板名称和参考答案");
  const answers = {};
  raw.split("\n").forEach(line => {
    const i = line.indexOf("=");
    if (i > 0) answers[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  const r = await fetch("/api/grading/answer-templates", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, subject: $("tplSubject").value, answers }),
  });
  const d = await r.json();
  if (!r.ok || !d.success) return alert(d.detail || "保存失败");
  $("tplTitle").value = ""; $("tplAnswers").value = ""; $("tplSubject").value = "数学";
  loadTemplates();
}
async function delTemplate(id) {
  if (!confirm("确定删除该模板？")) return;
  await fetch(`/api/grading/answer-templates/${id}`, { method: "DELETE" });
  loadTemplates();
}
loadTemplates();

let currentResults = [];

async function view(id) {
  const d = await (await fetch("/api/grading/result/" + id)).json();
  $("detail").style.display = "block";  $("exportCsvBtn").style.display = (d.results && d.results.length) ? "inline-block" : "none";
  $("exportCsvBtn").onclick = () => exportCsv(id);
  if (d.annotated_image_url) {
    $("detailImg").src = d.annotated_image_url + "?t=" + Date.now();
    $("detailImg").style.display = "block";
  } else $("detailImg").style.display = "none";
  let html = `<p>📌 ${d.summary || "无总评"}</p>`;
  currentResults = d.results || [];
  currentResults.forEach(q => {
    const tag = { correct:"✓", wrong:"✗", partial:"◐", unclear:"?" }[q.judgement] || "?";
    html += `<p><b>${tag} 第${q.question_no}题</b>`
      + (q.error_type ? ` · 错误类型：${q.error_type}` : "")
      + (q.confidence != null ? ` · 置信度 ${(q.confidence*100).toFixed(0)}%` : "")
      + (q.student_answer ? `<br>学生答案：${q.student_answer}` : "")
      + (q.correct_answer ? `<br>参考答案：${q.correct_answer}` : "")
      + (Array.isArray(q.steps) && q.steps.length ? `<br>🔍 步骤批改：` + q.steps.map(s =>
          `<span style="color:#b45309">第${s.step_no}步</span> ` + (s.content ? `${s.content} — ` : "")
          + (s.error_reason || "有误")).join("<br>") : "")
      + (q.student_answer ? ` <button style="font-size:12px;margin-left:6px;" onclick="reassignAnswer(${q.id},${d.submission_id},${q.question_no})">归属改错？</button>` : "")
      + `</p>`;
  });
  $("detailBody").innerHTML = html;
  $("detail").scrollIntoView({ behavior: "smooth" });
}

// 手动改答案归属（切题/归属错时兜底）：把该题答案移到教师指定的题号
async function reassignAnswer(sourceId, submissionId, sourceNo) {
  const no = prompt(`这份答案实际属于第几题？输入题号（当前记在第${sourceNo}题）`);
  if (!no) return;
  const target = (currentResults || []).find(q => q.question_no === parseInt(no, 10));
  if (!target) return alert(`没找到第${no}题的结果`);
  if (target.id === sourceId) return alert("不能移给自己");
  if (!confirm(`确定把第${sourceNo}题的答案并入第${target.question_no}题？合并后第${target.question_no}题判定会进入复核队列。`)) return;
  const r = await fetch(`/api/grading/reassign/${submissionId}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_id: sourceId, target_id: target.id }),
  });
  const d = await r.json();
  if (!r.ok || !d.success) return alert(d.detail || "操作失败");
  view(submissionId);
}

// ---------- 学情分析 ----------
async function loadAnalytics() {
  const d = await (await fetch("/api/analytics/analytics")).json();
  const body = $("analyticsBody");
  if (!d.total_questions) {
    body.innerHTML = `<p class="hint">暂无批改数据，批改完成后这里会展示学情分析</p>`;
    return;
  }
  const errTags = Object.entries(d.error_type_distribution || {})
    .map(([k, v]) => `<span class="tag">${k} × ${v}</span>`).join("") || `<span class="hint">暂无错误记录</span>`;
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const stuRows = (d.students || []).map(s => {
    const acc = s.accuracy == null ? "-" : (s.accuracy * 100).toFixed(0) + "%";
    const grade = s.grade ? `<span style="display:inline-block;padding:1px 8px;border-radius:8px;background:#f0ead8;color:#6b5b2e;font-weight:bold;">${s.grade}</span>` : "-";
    return `<tr><td>${esc(s.name)}</td><td>${s.total}</td><td>${s.correct}</td><td>${acc}</td><td>${grade}</td>` +
      `<td><button onclick="openStudentReport(${s.student_id},'${esc(s.name)}')">AI报告</button></td></tr>`;
  }).join("");
  const review = d.needs_review || [];
  const reviewRows = review.map(r => {
    const hot = r.note ? ' style="background:#fff3cd;"' : "";
    const note = r.note ? `<div style="font-size:12px;color:#856404;margin-top:2px;">⚠️ ${esc(r.note)}</div>` : "";
    return `<tr id="rev-${r.id}"${hot}><td>提交 #${r.submission_id}</td><td>第${r.question_no}题${note}</td><td>${r.judgement || "-"}</td><td>${r.confidence == null ? "-" : (r.confidence*100).toFixed(0) + "%"}</td><td>` +
    ["correct", "wrong", "partial"].map(j =>
      `<button style="margin-right:4px;" onclick="overrideQuestion(${r.id},'${j}')">${j === "correct" ? "✓对" : j === "wrong" ? "✗错" : "◐部分"}</button>`
    ).join("") + `</td></tr>`;
  }).join("");
  // ---- SVG 图表 ----
  // 学生正确率横向条形图
  const stus = (d.students || []).slice().sort((a,b)=>(b.accuracy||0)-(a.accuracy||0));
  const bw = 150, barH = 22, gap = 8;
  const accBars = stus.map((s, i) => {
    const acc = s.accuracy == null ? 0 : s.accuracy;
    const w = Math.max(2, Math.round(acc * bw));
    const y = i * (barH + gap);
    const color = acc >= 0.85 ? "#27ae60" : acc >= 0.7 ? "#f39c12" : "#e74c3c";
    return `<text x="0" y="${y + barH - 6}" font-size="12" fill="#333">${esc(s.name)}</text>` +
      `<rect x="76" y="${y}" width="${bw}" height="${barH}" rx="4" fill="#f0f0f0"/>` +
      `<rect x="76" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"/>` +
      `<text x="${76 + bw + 6}" y="${y + barH - 6}" font-size="12" fill="#555">${(acc*100).toFixed(0)}%</text>`;
  }).join("");
  const accSvgH = stus.length * (barH + gap) + 4;
  // 错误类型条形图
  const errs = Object.entries(d.error_type_distribution || {}).sort((a,b)=>b[1]-a[1]);
  const maxErr = Math.max(1, ...errs.map(e => e[1]));
  const errColors = {"计算错误":"#e74c3c","概念错误":"#8e44ad","粗心":"#f39c12","未作答":"#95a5a6","审题错误":"#2980b9"};
  const errBars = errs.map(([k, v], i) => {
    const y = i * (barH + gap);
    const w = Math.max(2, Math.round(v / maxErr * bw));
    return `<text x="0" y="${y + barH - 6}" font-size="12" fill="#333">${esc(k)}</text>` +
      `<rect x="76" y="${y}" width="${bw}" height="${barH}" rx="4" fill="#f0f0f0"/>` +
      `<rect x="76" y="${y}" width="${w}" height="${barH}" rx="4" fill="${errColors[k] || "#615d59"}"/>` +
      `<text x="${76 + bw + 6}" y="${y + barH - 6}" font-size="12" fill="#555">${v}次</text>`;
  }).join("");
  const errSvgH = Math.max(errs.length, 1) * (barH + gap) + 4;
  // 错误类型占比饼图（PRD 七章：错误类型分布的占比视图）
  const total_err = errs.reduce((a, e) => a + e[1], 0);
  const er = 40, eC = 2 * Math.PI * er;
  let eOff = 0;
  const errArcs = total_err > 0 ? errs.map(([k, v]) => {
    const frac = v / total_err;
    const seg = `<circle r="${er}" cx="50" cy="50" fill="none" stroke="${errColors[k] || "#615d59"}" stroke-width="16"` +
      ` stroke-dasharray="${(frac * eC).toFixed(1)} ${eC.toFixed(1)}" stroke-dashoffset="${(-eOff * eC).toFixed(1)}"` +
      ` transform="rotate(-90 50 50)"><title>${esc(k)} ${v}次</title></circle>`;
    eOff += frac;
    return seg;
  }).join("") : "";
  const errLegend = total_err > 0 ? errs.map(([k, v]) =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:12px;color:#555;">` +
    `<span style="width:10px;height:10px;border-radius:3px;display:inline-block;background:${errColors[k]||"#615d59"}"></span>` +
    `${esc(k)} ${Math.round(v/total_err*100)}%</span>`).join("") : "";
  // 判定分布环形图
  const jd = d.judgement_distribution || {};
  const jdColors = {correct:"#27ae60", wrong:"#e74c3c", partial:"#f39c12", unclear:"#95a5a6"};
  const jdNames = {correct:"正确", wrong:"错误", partial:"部分对", unclear:"存疑"};
  const total_j = Object.values(jd).reduce((a,b)=>a+b, 0) || 1;
  const R = 44, C = 2 * Math.PI * R;
  let offset = 0;
  const arcs = Object.entries(jd).map(([k, v]) => {
    const frac = v / total_j;
    const seg = `<circle r="${R}" cx="56" cy="56" fill="none" stroke="${jdColors[k] || "#999"}" stroke-width="14"` +
      ` stroke-dasharray="${(frac * C).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-offset * C).toFixed(1)}"` +
      ` transform="rotate(-90 56 56)"><title>${jdNames[k] || k} ${v}题</title></circle>`;
    offset += frac;
    return seg;
  }).join("");
  const legend = Object.entries(jd).map(([k,v]) =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:12px;color:#555;">` +
    `<span style="width:10px;height:10px;border-radius:3px;display:inline-block;background:${jdColors[k]||"#999"}"></span>` +
    `${jdNames[k]||k} ${Math.round(v/total_j*100)}%</span>`).join("");
  // ---- 趋势折线图 + 班级对比条形图（待办 l，数据来自 /api/analytics/trends）----
  let trendHtml = "", classHtml = "";
  try {
    const t = await (await fetch("/api/analytics/analytics/trends")).json();
    const tw = 420, th = 160, padL = 34, padB = 22, padT = 10;
    const nPts = Math.max(...(t.series || []).map(s => s.history.length), 0);
    if ((t.series || []).length && nPts >= 1) {
      const maxN = Math.max(nPts, 2);
      const px = i => padL + (maxN <= 1 ? 0 : i * (tw - padL - 14) / (maxN - 1));
      const py = a => padT + (1 - a) * (th - padT - padB);
      const lineColor = ["#2980b9", "#27ae60", "#8e44ad", "#e67e22", "#16a085", "#c0392b"];
      let svg = "";
      [0, 0.5, 1].forEach(v => {
        svg += `<line x1="${padL}" y1="${py(v)}" x2="${tw - 14}" y2="${py(v)}" stroke="#e5e0d5" stroke-width="1"/>` +
          `<text x="${padL - 6}" y="${py(v) + 4}" font-size="10" fill="#999" text-anchor="end">${v * 100}%</text>`;
      });
      t.series.forEach((s, si) => {
        const color = lineColor[si % lineColor.length];
        const pts = s.history.map((h, i) => `${px(i).toFixed(1)},${py(h.accuracy).toFixed(1)}`).join(" ");
        svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"><title>${esc(s.name)}</title></polyline>`;
        s.history.forEach((h, i) => {
          svg += `<circle cx="${px(i).toFixed(1)}" cy="${py(h.accuracy).toFixed(1)}" r="3" fill="${color}"><title>${esc(s.name)} ${h.date} ${Math.round(h.accuracy * 100)}%</title></circle>`;
        });
        const last = s.history[s.history.length - 1];
        svg += `<text x="${(px(s.history.length - 1) + 6).toFixed(1)}" y="${(py(last.accuracy) + 4).toFixed(1)}" font-size="11" fill="${color}">${esc(s.name)}</text>`;
      });
      // 日期轴（取第一个序列的日期）
      const d0 = t.series.find(s => s.history.length) ;
      if (d0) d0.history.forEach((h, i) => {
        if (h.date) svg += `<text x="${px(i).toFixed(1)}" y="${th - 6}" font-size="10" fill="#999" text-anchor="middle">${esc(h.date)}</text>`;
      });
      trendHtml = `<p style="margin:0 0 6px;font-size:14px;"><b>学生正确率趋势</b>（每次作业一个点，悬停看明细）</p>
        <svg width="${tw}" height="${th}" role="img" aria-label="学生正确率趋势折线图" style="max-width:100%;">${svg}</svg>`;
    } else {
      trendHtml = `<p style="margin:0 0 6px;font-size:14px;"><b>学生正确率趋势</b></p><p class="hint">学生至少需要一次已批改的作业</p>`;
    }
    // 班级对比条形图
    const cls = t.classes || [];
    if (cls.length) {
      const cbw = 130, cbarH = 24;
      const cBars = cls.map((c, i) => {
        const acc = c.accuracy == null ? 0 : c.accuracy;
        const w = Math.max(2, Math.round(acc * cbw));
        const color = acc >= 0.85 ? "#27ae60" : acc >= 0.7 ? "#f39c12" : "#e74c3c";
        return `<text x="0" y="${i * (cbarH + 8) + cbarH - 7}" font-size="12" fill="#333">${esc(c.name)}</text>` +
          `<rect x="80" y="${i * (cbarH + 8)}" width="${cbw}" height="${cbarH}" rx="4" fill="#f0f0f0"/>` +
          `<rect x="80" y="${i * (cbarH + 8)}" width="${w}" height="${cbarH}" rx="4" fill="${color}"/>` +
          `<text x="${80 + cbw + 6}" y="${i * (cbarH + 8) + cbarH - 7}" font-size="12" fill="#555">${(acc * 100).toFixed(0)}%（${c.total}题）</text>`;
      }).join("");
      classHtml = `<p style="margin:14px 0 6px;font-size:14px;"><b>班级平均正确率对比</b></p>
        <svg width="${80 + cbw + 110}" height="${cls.length * (cbarH + 8) + 4}" role="img" aria-label="班级对比条形图">${cBars}</svg>`;
    }
  } catch (e) { /* 趋势接口失败不影响主学情展示 */ }
  const trendBlock = trendHtml ? `<div style="margin:6px 0 0;">${trendHtml}</div>` : "";
  const classBlock = classHtml ? `<div style="margin:6px 0 0;">${classHtml}</div>` : "";
  const kps = (d.knowledge_points || []);
  const kpRows = kps.map(k => {
    const acc = k.accuracy == null ? "-" : (k.accuracy * 100).toFixed(0) + "%";
    const color = k.accuracy == null ? "#555" : k.accuracy >= 0.85 ? "#27ae60" : k.accuracy >= 0.7 ? "#f39c12" : "#e74c3c";
    return `<tr><td>${esc(k.name)}</td><td>${k.total}</td><td>${k.correct}</td><td style="color:${color};font-weight:bold;">${acc}</td></tr>`;
  }).join("");
  const kpBlock = kps.length ? `
    <p style="margin:14px 0 6px;font-size:14px;"><b>知识点掌握情况</b>（薄弱知识点排前面，正确率由 AI 识别的考点统计）</p>
    <table>
      <thead><tr><th>知识点</th><th>总题数</th><th>正确</th><th>掌握率</th></tr></thead>
      <tbody>${kpRows}</tbody>
    </table>` : "";
    // AI 一致率（待办 o）
    const ag = d.ai_agreement || {};
    const agLine = ag.reviewed_total > 0
      ? ` · 🤖 AI 判定与教师确认一致率 <b style="color:${ag.rate >= 0.9 ? "#27ae60" : "#f39c12"};">${(ag.rate * 100).toFixed(0)}%</b>（已复核 ${ag.reviewed_total} 题：一致 ${ag.agree}，改判 ${ag.disagree}）`
      : ` · 🤖 AI 一致率：暂无教师复核记录`;
  body.innerHTML = `
    <p style="margin:0 0 14px;font-size:14px;">共批改 <b>${d.total_questions}</b> 题 ·
      待复核 <b style="color:#c0392b;">${d.needs_review_count}</b> 题${agLine}</p>
    <div style="display:flex;flex-wrap:wrap;gap:24px;margin-bottom:16px;">
      <div style="flex:1;min-width:260px;">
        <p style="margin:0 0 6px;font-size:14px;"><b>学生正确率</b>（按正确率排序）</p>
        <svg width="${76 + bw + 48}" height="${accSvgH}" role="img" aria-label="学生正确率条形图">${accBars}</svg>
      </div>
      <div style="flex:1;min-width:260px;">
        <p style="margin:0 0 6px;font-size:14px;"><b>错误类型分布</b></p>
        <svg width="${76 + bw + 48}" height="${errSvgH}" role="img" aria-label="错误类型条形图">${errBars || `<text x="0" y="14" font-size="12" fill="#999">暂无错误记录 🎉</text>`}</svg>
        ${total_err > 0 ? `<div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
          <svg width="100" height="100" role="img" aria-label="错误类型占比饼图">${errArcs}</svg>
          <div>${errLegend}</div>
        </div>` : ""}
      </div>
    </div>
    <p style="margin:0 0 6px;font-size:14px;"><b>判定分布</b></p>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;">
      <svg width="112" height="112" role="img" aria-label="判定分布环形图">${arcs}</svg>
      <div>${legend}</div>
    </div>
    ${trendBlock}
    ${classBlock}
    <details style="margin-top:6px;">
      <summary style="cursor:pointer;font-size:14px;"><b>学生明细表</b></summary>
      <table style="margin-top:8px;">
        <thead><tr><th>学生</th><th>总题数</th><th>正确</th><th>正确率</th><th>等级</th><th>AI学情报告</th></tr></thead>
        <tbody>${stuRows || `<tr><td colspan="6" class="hint">暂无数据</td></tr>`}</tbody>
      </table>
    </details>
    ${kpBlock}
    <div id="adviceBlock" style="margin:18px 0 0;">
      <p style="margin:0 0 6px;font-size:14px;"><b>AI 教学建议</b>
        <button id="adviceBtn" style="margin-left:8px;" onclick="generateAdvice()">重新生成</button>
        <span id="adviceStatus" class="hint" style="margin-left:8px;"></span>

    <div id="stuReportPanel" style="display:none;margin:18px 0 0;border-top:1px dashed #ddd;padding-top:12px;">
      <p style="margin:0 0 6px;font-size:14px;"><b id="stuReportTitle">AI 学情报告</b>
        <button id="stuReportGenBtn" style="margin-left:8px;" onclick="generateStudentReport()">生成 / 重新生成</button>
        <span id="stuReportStatus" class="hint" style="margin-left:8px;"></span>
      </p>
      <div id="stuReportBody"><p class="hint">加载中…</p></div>
    </div>

      <tbody>${reviewRows || `<tr><td colspan="5" class="hint">没有需要复核的题目 🎉</td></tr>`}</tbody>

// 教师复核修正：改写判定，写入 teacher_override 后刷新面板
async function overrideQuestion(qrId, judgement) {
  const r = await fetch("/api/analytics/override", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question_result_id: qrId, judgement: judgement})
  });
  if (!r.ok) { alert("复核修正失败: " + r.status); return; }
  const row = document.getElementById("rev-" + qrId);
  if (row) row.remove();
  loadAnalytics();
}

function renderAdvice(a) {
  const body = document.getElementById("adviceBody");
  if (!a) { body.innerHTML = `<p class="hint">尚未生成。点击"重新生成"让 AI 基于批改数据给出教学建议。</p>`; return; }
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const sug = (a.advice.suggestions || []).map(s => `<li>${esc(s)}</li>`).join("");
  const focus = (a.advice.focus_students || []).map(f =>
    `<span class="tag" title="${esc(f.reason)}">关注: ${esc(f.name)}</span>`).join(" ");
  body.innerHTML = `
    <p style="margin:4px 0;font-size:14px;">${esc(a.advice.summary || "")}</p>
    <ul style="margin:6px 0;font-size:14px;">${sug}</ul>
    ${focus ? `<div style="margin-bottom:6px;">${focus}</div>` : ""}
    <p class="hint">生成时间 ${a.created_at ? a.created_at.slice(0,16).replace("T"," ") : "-"} · 模型 ${esc(a.model || "-")}</p>`;
}
async function generateAdvice() {
  const btn = document.getElementById("adviceBtn");
  const status = document.getElementById("adviceStatus");
  btn.disabled = true; status.textContent = "AI 正在分析（约10-30秒）…";
  try {
    const r = await fetch("/api/analytics/teaching-advice/generate", { method: "POST" });
    const d = await r.json();
    if (!r.ok || !d.success) {
      status.textContent = "";
      alert(d.error || d.detail || "生成失败，请稍后重试");
      return;
    }
    renderAdvice(d);
    status.textContent = "✅ 已生成";
  } finally {
    btn.disabled = false;
    setTimeout(() => { status.textContent = ""; }, 4000);
  }
}

// ---------- AI 学生学情报告（待办 k） ----------
async function openStudentReport(studentId, name) {
  const panel = document.getElementById("stuReportPanel");
  const body = document.getElementById("stuReportBody");
  panel.style.display = "block";
  body.innerHTML = `<p class="hint">加载中…</p>`;
  panel.scrollIntoView({ behavior: "smooth", block: "center" });
  const d = await (await fetch(`/api/analytics/student-report/${studentId}`)).json();
  renderStudentReport(d.report, name, studentId);
}
function renderStudentReport(rep, name, studentId) {
  const body = document.getElementById("stuReportBody");
  const title = document.getElementById("stuReportTitle");
  title.textContent = name ? `${name} · AI 学情报告` : "AI 学情报告";
  if (!rep) { body.innerHTML = `<p class="hint">尚未生成。点击\"生成\"让 AI 基于该生的历史批改数据写学情报告。</p>`; return; }
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const lst = (label, items, icon) => (items || []).length
    ? `<p style="margin:6px 0 2px;font-size:14px;"><b>${icon} ${label}</b></p><ul style="margin:2px 0;font-size:14px;">` +
      items.map(s => `<li>${esc(s)}</li>`).join("") + `</ul>` : "";
  document.getElementById("stuReportGenBtn").dataset.studentId = studentId || (rep && rep.student_id);
  body.innerHTML = `
    <p style="margin:4px 0;font-size:14px;">${esc(rep.report.summary || "")}</p>
    ${lst("掌握较好", rep.report.strengths, "✅")}
    ${lst("薄弱之处", rep.report.weaknesses, "⚠️")}
    ${lst("教学建议", rep.report.advice, "💡")}
    <p class="hint">生成时间 ${rep.created_at ? rep.created_at.slice(0,16).replace("T"," ") : "-"} · 模型 ${esc(rep.model || "-")}</p>`;
}
async function generateStudentReport() {
  const btn = document.getElementById("stuReportGenBtn");
  const status = document.getElementById("stuReportStatus");
  const sid = btn.dataset.studentId;
  if (!sid) { alert("请先在学生明细表点某个学生的\"AI报告\""); return; }
  btn.disabled = true; status.textContent = "AI 正在撰写（约10-30秒）…";
  try {
    const r = await fetch(`/api/analytics/student-report/${sid}/generate`, { method: "POST" });
    const d = await r.json();
    if (!r.ok || !d.success) {
      status.textContent = "";
      alert(d.error || d.detail || "生成失败，请稍后重试");
      return;
    }
    renderStudentReport(d, null);
    status.textContent = "✅ 已生成";
  } finally {
    btn.disabled = false;
    setTimeout(() => { status.textContent = ""; }, 4000);
  }
}

// ---------- 管理员 PIN 解锁 ----------
async function ensureAdmin(autoShow = true) {
  const s = await (await fetch("/api/auth/pin-status")).json();
  if (s.unlocked) return true;
  if (!autoShow) return false;   // 静默检查：不自动弹 PIN（首次引导优先）
  const gate = $("pinGate");
  gate.style.display = "flex";
  setTimeout(() => $("pinInput").focus(), 50);
  return false;
}

async function pinUnlock() {
  const msg = $("pinMsg");
  const pin = $("pinInput").value;
  if (!pin) { msg.textContent = "请输入 PIN"; return; }
  const r = await fetch("/api/auth/pin-login", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ pin })
  });
  if (r.ok) {
    $("pinGate").style.display = "none";
    location.reload();
  } else {
    msg.textContent = (await r.json()).detail || "PIN 错误";
  }
}

// ---------- 首次三步引导 / 上下文切换 ----------
let _wizMode = "setup";   // setup=首次引导(context接口,标记完成) / switch=右上角切换
let _wizStep = 0;         // 0学段 1学科 2班级
let _wizSel = { stage: null, subject: null, class_name: null };
let _wizData = null;      // /api/setup/status 结果

function wizChip(label, value, selected) {
  return `<button onclick="wizPick('${value.replace(/'/g, "\\'")}', this)"` +
    ` style="padding:9px 16px;border:1.5px solid ${selected ? "#c0392b" : "#ddd"};` +
    `background:${selected ? "#fdf3f2" : "#fff"};color:${selected ? "#c0392b" : "#333"};` +
    `border-radius:8px;font-size:14px;cursor:pointer;">${label}</button>`;
}

function wizRender() {
  const labels = ["第 1/3 步：选择学段", "第 2/3 步：选择学科", "第 3/3 步：选择班级"];
  $("wizStepLabel").textContent = labels[_wizStep];
  const box = $("wizOptions");
  const custom = $("wizCustomRow");
  $("wizMsg").textContent = "";
  $("wizBackBtn").style.visibility = _wizStep === 0 ? "hidden" : "visible";
  $("wizNextBtn").textContent = _wizStep === 2 ? (_wizMode === "setup" ? "✓ 完成设置" : "✓ 切换") : "下一步";
  if (_wizStep === 0) {
    custom.style.display = "none";
    box.innerHTML = (_wizData.stages || []).map(s =>
      wizChip(s.name, s.name, _wizSel.stage === s.name)).join("")
      || `<p class="hint">暂无学段</p>`;
  } else if (_wizStep === 1) {
    custom.style.display = "none";
    box.innerHTML = (_wizData.subjects || []).map(s =>
      wizChip(s.name, s.name, _wizSel.subject === s.name)).join("")
      || `<p class="hint">暂无学科</p>`;
  } else {
    custom.style.display = "block";
    box.innerHTML = (_wizData.classes || []).map(c =>
      wizChip(c.name, c.name, _wizSel.class_name === c.name)).join("")
      || `<p class="hint">还没有班级，直接在下面输入名称创建</p>`;
  }
}

function wizPick(value, btn) {
  if (_wizStep === 0) _wizSel.stage = value;
  if (_wizStep === 1) _wizSel.subject = value;
  if (_wizStep === 2) { _wizSel.class_name = value; $("wizCustomInput").value = ""; }
  wizRender();
}

function wizBack() {
  if (_wizStep > 0) { _wizStep--; wizRender(); }
}

async function wizNext() {
  const msg = $("wizMsg");
  if (_wizStep === 0 && !_wizSel.stage) { msg.textContent = "请选择学段"; return; }
  if (_wizStep === 1 && !_wizSel.subject) { msg.textContent = "请选择学科"; return; }
  if (_wizStep === 2) {
    const cls = ($("wizCustomInput").value || "").trim() || _wizSel.class_name;
    if (!cls) { msg.textContent = "请选择或输入班级名称"; return; }
    _wizSel.class_name = cls;
    // 解锁管理功能后保存
    const ok = await ensureAdmin();
    if (!ok) return;
    const url = _wizMode === "setup" ? "/api/setup/complete" : "/api/setup/context";
    const r = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ stage: _wizSel.stage, subject: _wizSel.subject, class_name: _wizSel.class_name }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.success) { msg.textContent = d.detail || "保存失败"; return; }
    $("wizGate").style.display = "none";
    $("ctxLabel").textContent = `${_wizSel.class_name} · ${_wizSel.subject}`;
    if (_wizMode === "setup") {
      $("wizTitle").textContent = "🎉 设置完成";
      $("wizTitle").style.color = "#27ae60";
      setTimeout(() => { location.reload(); }, 600);
    }
    return;
  }
  _wizStep++;
  wizRender();
}

function openWizard(mode) {
  _wizMode = mode;
  _wizStep = 0;
  _wizSel = { stage: null, subject: null, class_name: null };
  $("wizTitle").textContent = mode === "setup" ? "👋 欢迎使用红笔" : "🏫 切换教学上下文";
  $("wizSub").textContent = mode === "setup"
    ? "三步完成初始设置（随时可在右上角切换）"
    : "选择当前使用的学段 / 学科 / 班级";
  $("wizGate").style.display = "flex";
  wizRender();
}

async function initSetup() {
  try { _wizData = await (await fetch("/api/setup/status")).json(); } catch (e) { return; }
  if (!_wizData) return;
  const dft = _wizData.defaults || {};
  $("ctxLabel").textContent = (dft.class_name || "未设置") + " · " + (dft.subject || "-");
  if (!_wizData.setup_completed) openWizard("setup");
}

load(); loadRows(); initSetup();
ensureAdmin(false).then(ok => { if (ok) { loadManage(); loadAnalytics(); } });

// 把技术报错翻译成老师能看懂的话
function friendlyError(msg){
  msg = msg || "";
  if (/401|Unauthorized|invalid.*key|无效的密钥|authentication/i.test(msg)) return "API Key 无效或已失效——请到设置页检查 Key 是否粘贴完整，必要时重新生成";
  if (/402|insufficient|balance|余额/i.test(msg)) return "模型账户余额不足——请到模型官网充值后重试（余额永久有效）";
  if (/429|rate.?limit|限流/i.test(msg)) return "请求太快被限流——等 1 分钟后点重试即可";
  if (/timeout|timed? ?out|超时/i.test(msg)) return "网络超时——检查电脑网络和 VPN/代理设置后重试";
  if (/connection|connect|refused|network|网络/i.test(msg)) return "网络连接失败——检查电脑能否上网，以及防火墙是否放行";
  if (/vision|image|multimodal|不支持.*图|视觉/i.test(msg)) return "当前模型不支持图片识别——请到设置页换用支持视觉的模型（可点测试连接验证）";
  if (/quality|模糊|blur/i.test(msg)) return "照片质量不达标——请在光线充足处对准作业整页重新拍摄";
  return msg;
}
